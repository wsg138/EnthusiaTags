<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Remembered reward — concept</title><style>body{font:16px system-ui;background:#181a1d;color:#e5e8ea;max-width:36rem;margin:auto;padding:1.5rem}button{font:inherit;padding:.8rem;margin:.25rem;border:1px solid #9aa0a6;background:#353c43;color:#fff;border-radius:.5rem}.card{padding:1rem;margin:1rem 0;background:#272c32;border:1px solid #8f999f}.muted{color:#a7adb4}</style><h1>Remembered reward</h1><p>Simulation of the separate reward flow; actual Minecraft presentation and timing need testing.</p><button onclick="show('unearned')">Not eligible</button><button onclick="show('earned')">Earned before event end</button><button onclick="show('ready')">Eligible after event</button><button onclick="show('claimed')">Claimed</button><div id="view" class="card"></div><script>function show(s){document.getElementById('view').innerHTML=s==='unearned'?'The Remembered entry is absent from this view.':s==='earned'?'<span class="muted">Remembered</span><p>Earned · Claim opens after the event</p>':s==='ready'?'<span class="muted">Remembered</span><p>Eligible after the event · Ready to claim</p><button onclick="show(\'claimed\')">Claim tag</button>':'<span class="muted">Remembered</span><p>Claimed · Available in tags</p>'}show('unearned')</script></html>
