name: Build

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: enthusiatags-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-review-fixes:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reward-vault-rebalance-100
          fetch-depth: 0

      - name: Apply reviewed source and resource fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one {label}, found {count}")
              return text.replace(old, new, 1)

          migrator_path = Path("src/main/java/org/enthusia/tags/ConfigMigrator.java")
          migrator = migrator_path.read_text()
          migrator = replace_once(
              migrator,
              "changed |= migrateKnownValues(resourceName, config, existingVersion, report);",
              "changed |= migrateKnownValues(resourceName, config, defaults, existingVersion, report);",
              "migration call",
          )
          migrator = replace_once(
              migrator,
              "private boolean migrateKnownValues(String resourceName, YamlConfiguration config,\n                                       int existingVersion, MigrationReport report)",
              "private boolean migrateKnownValues(String resourceName, YamlConfiguration config,\n                                       YamlConfiguration defaults, int existingVersion,\n                                       MigrationReport report)",
              "migration signature",
          )
          migrator = replace_once(
              migrator,
              "RewardConfigV5Migration.migrateRewards(config, report)",
              "RewardConfigV5Migration.migrateRewards(config, defaults, report)",
              "version-5 migration invocation",
          )
          migrator_path.write_text(migrator)

          rewards_path = Path("src/main/resources/rewards.yml")
          rewards = rewards_path.read_text()
          labels = {
              "label: 8Deepslate Dedication bonus": "label: Deepslate Dedication bonus",
              "label: 8Coal Miner bonus": "label: Coal Miner bonus",
              "label: 8Deep Coal Miner bonus": "label: Deep Coal Miner bonus",
              "label: 9Lapis Hoarder bonus": "label: Lapis Hoarder bonus",
              "label: cRedstone Engineer bonus": "label: Redstone Engineer bonus",
              "label: 4Deep Redstone Engineer bonus": "label: Deep Redstone Engineer bonus",
              "label: aEmerald Hunter bonus": "label: Emerald Hunter bonus",
              "label: 5Ancient Debris Hunter bonus": "label: Ancient Debris Hunter bonus",
              "label: eQuarter Million bonus": "label: Quarter Million bonus",
              "label: 6lMillionaire bonus": "label: Millionaire bonus",
          }
          for old, new in labels.items():
              rewards = replace_once(rewards, old, new, old)
          old_banner = '''
  # ---------------------------------------------------------------------------
  # Reward expansion: 48 new rewards. Existing reward IDs above are unchanged.
  # ---------------------------------------------------------------------------
    category: economy
  getting_around:
'''
          new_banner = '''
    category: economy

  # ---------------------------------------------------------------------------
  # Reward expansion: 48 new rewards. Existing reward IDs above are unchanged.
  # ---------------------------------------------------------------------------
  getting_around:
'''
          rewards = replace_once(rewards, old_banner, new_banner, "reward expansion banner")
          rewards_path.write_text(rewards)

          Path(".github/workflows/build.yml").write_text('''name: Build

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: enthusiatags-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Test and package
        run: mvn --batch-mode --no-transfer-progress clean test package

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: EnthusiaTags-${{ github.sha }}
          path: target/EnthusiaTags.jar
          if-no-files-found: error
          retention-days: 14
''')

      - name: Commit reviewed fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Address reward migration review findings"
          git push origin HEAD:agent/reward-vault-rebalance-100
