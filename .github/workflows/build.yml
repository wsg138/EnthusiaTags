name: Apply reward storage executor integration

on:
  push:
    branches:
      - agent/fix-reward-shutdown-deadlock

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-reward-shutdown-deadlock
          fetch-depth: 0

      - name: Wire reentrant reward storage executor
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/main/java/org/enthusia/tags/rewards/RewardStorage.java")
          source = path.read_text()
          old = '        this.executor = Executors.newSingleThreadExecutor(new StorageThreadFactory("enthusia-tags-rewards-storage"));\n'
          new = '        this.executor = new ReentrantSingleThreadExecutor("enthusia-tags-rewards-storage");\n'
          if source.count(old) != 1:
              raise SystemExit(f"Expected one reward executor constructor, found {source.count(old)}")
          path.write_text(source.replace(old, new, 1))

      - name: Commit source integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/org/enthusia/tags/rewards/RewardStorage.java
          git commit -m "Wire reentrant reward storage executor"
          git push origin HEAD:agent/fix-reward-shutdown-deadlock
