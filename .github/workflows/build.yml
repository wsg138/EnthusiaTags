name: Build

on:
  push:
  pull_request:
    branches: [main]

permissions:
  checks: read
  contents: read
  pull-requests: read

concurrency:
  group: enthusiatags-build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact checkout
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"

      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Bootstrap pinned production LoreItems release
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_VERSION="$(sed -n 's:.*<loreitems.release.version>\(.*\)</loreitems.release.version>.*:\1:p' pom.xml)"
          RELEASE_URL="$(sed -n 's:.*<loreitems.release.url>\(.*\)</loreitems.release.url>.*:\1:p' pom.xml)"
          RELEASE_SHA="$(sed -n 's:.*<loreitems.release.sha256>\(.*\)</loreitems.release.sha256>.*:\1:p' pom.xml)"
          test -n "${RELEASE_VERSION}"
          test -n "${RELEASE_URL}"
          test -n "${RELEASE_SHA}"
          mkdir -p .wp06-deps
          curl --fail --location --retry 3 --retry-delay 2 \
            --proto '=https' --tlsv1.2 \
            --header 'Accept: application/octet-stream' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --user-agent 'enthusiatags-wp06-ci' \
            "${RELEASE_URL}" -o .wp06-deps/EnthusiaLoreItems.jar
          printf '%s  %s\n' "${RELEASE_SHA}" '.wp06-deps/EnthusiaLoreItems.jar' | sha256sum --check --strict
          JAR_PATH="${GITHUB_WORKSPACE}/.wp06-deps/EnthusiaLoreItems.jar"
          (
            cd "${RUNNER_TEMP}"
            mvn --batch-mode --no-transfer-progress \
              org.apache.maven.plugins:maven-install-plugin:3.1.3:install-file \
              -Dfile="${JAR_PATH}" \
              -DgroupId=net.enthusia \
              -DartifactId=EnthusiaLoreItems-released \
              -Dversion="${RELEASE_VERSION}" \
              -Dpackaging=jar \
              -DgeneratePom=true
          )

      - name: Test and package
        shell: bash
        run: |
          set -o pipefail
          mvn --batch-mode --no-transfer-progress clean test package 2>&1 | tee /tmp/enthusiatags-maven.log

      - name: Preserve Maven failure summary
        if: failure()
        shell: bash
        run: |
          if [ -f /tmp/enthusiatags-maven.log ]; then
            {
              echo '### Maven failure tail'
              echo '```text'
              tail -n 120 /tmp/enthusiatags-maven.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify exact-head Codacy
        if: github.event_name == 'pull_request' && success()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 tools/check_codacy.py

      - name: Upload plugin JAR
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: EnthusiaTags-${{ github.event.pull_request.head.sha || github.sha }}
          path: target/EnthusiaTags.jar
          if-no-files-found: error
          retention-days: 14
