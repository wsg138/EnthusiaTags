          new_flush = '''    private void flushAllBlocking() {
        Map<UUID, CompletableFuture<Void>> pending = new LinkedHashMap<>();
        for (Map.Entry<UUID, RewardPlayerState> entry : playerStates.entrySet()) {
            UUID playerId = entry.getKey();
            RewardPlayerState state = entry.getValue();
            if (state == null || !state.isLoaded() || !state.isDirty()) {
                continue;
            }
            RewardStorage.StoredRewardData snapshot = snapshotState(state);
            CompletableFuture<Void> flush = storage.saveAsync(playerId, snapshot).handle((result, throwable) -> {
                if (throwable != null) {
                    plugin.getLogger().warning("Failed to flush reward state for " + playerId
                        + " during shutdown: " + describeFailure(throwable));
                } else if (result == RewardStorage.WriteResult.WRITTEN) {
                    state.markClean(snapshot.revision());
                }
                return null;
            });
            pending.put(playerId, flush);
        }
        if (pending.isEmpty()) {
            return;
        }
        try {
            CompletableFuture.allOf(pending.values().toArray(CompletableFuture[]::new))
                .get(STORAGE_FLUSH_TIMEOUT_SECONDS, TimeUnit.SECONDS);
        } catch (InterruptedException ex) {
            Thread.currentThread().interrupt();
            plugin.getLogger().warning("Interrupted while flushing reward state during shutdown: "
                + describeFailure(ex));
        } catch (ExecutionException ex) {
            plugin.getLogger().warning("Reward shutdown flush failed: " + describeFailure(ex));
        } catch (TimeoutException ex) {
            long unfinished = pending.values().stream().filter(future -> !future.isDone()).count();
            plugin.getLogger().warning("Timed out after " + STORAGE_FLUSH_TIMEOUT_SECONDS
                + " seconds while flushing reward state; " + unfinished
                + " player save(s) remain queued for storage shutdown.");
        }
    }

    private String describeFailure(Throwable throwable) {
        Throwable current = throwable;
        while ((current instanceof ExecutionException
            || current instanceof java.util.concurrent.CompletionException)
            && current.getCause() != null) {
            current = current.getCause();
        }
        String message = current.getMessage();
        return current.getClass().getSimpleName()
            + (message == null || message.isBlank() ? "" : ": " + message);
    }
