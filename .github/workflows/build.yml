          new_disable = '''    public void disable() {
        lifecycle.set(ServiceLifecycle.STOPPING);
        stopFlushTask();
        stopGlobalScanTask();
        stopSyncDrainTask();
        stopUnlockCheckTask();
        if (!stopClaimWorkers()) {
            inFlightClaims.clear();
            lifecycle.set(ServiceLifecycle.STOPPED);
            return;
        }
        if (storage != null) {
            flushAllBlocking();
        }
        pendingLoads.clear();
        pendingCounterDeltas.clear();
        progressSnapshots.clear();
        rewardSyncQueue.clear();
        queuedRewardSyncPlayers.clear();
        queuedUnlockChecks.clear();
        playerStates.clear();
        if (storage != null) {
            storage.close();
        }
        inFlightClaims.clear();
        activeOperations.clear();
        lifecycle.set(ServiceLifecycle.STOPPED);
    }

    private boolean stopClaimWorkers() {
        if (claimExecutor == null) {
            return true;
        }
        claimExecutor.shutdown();
        try {
            if (claimExecutor.awaitTermination(CLAIM_SHUTDOWN_TIMEOUT_SECONDS, TimeUnit.SECONDS)) {
                return true;
            }
            List<Runnable> abandoned = claimExecutor.shutdownNow();
            plugin.getLogger().warning("Reward claim workers exceeded graceful shutdown; interrupting "
                + abandoned.size() + " queued task(s).");
            if (claimExecutor.awaitTermination(FORCED_CLAIM_SHUTDOWN_TIMEOUT_SECONDS, TimeUnit.SECONDS)) {
                return true;
            }
            plugin.getLogger().severe("Reward claim workers did not stop; storage will remain open.");
            return false;
        } catch (InterruptedException ex) {
            Thread.currentThread().interrupt();
            claimExecutor.shutdownNow();
            plugin.getLogger().severe("Interrupted while stopping reward claim workers; storage will remain open.");
            return false;
        }
    }
'''
