name: One-time animation fallback fix

on:
  push:
    branches:
      - agent/daily-live-hardening

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply animation completion fallback'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/daily-live-hardening
          fetch-depth: 0

      - name: Add static-menu fallback
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/main/java/org/enthusia/tags/daily/DailyService.java")
          text = path.read_text(encoding="utf-8")
          old = '''        } catch (IllegalArgumentException | IllegalPluginAccessException ex) {
                      plugin.getLogger().log(Level.WARNING, "Could not finish daily animation", ex);
                  }
          '''
          new = '''        } catch (IllegalArgumentException | IllegalPluginAccessException ex) {
                      plugin.getLogger().log(Level.WARNING, "Could not finish daily animation", ex);
                      openLoaded(playerId, false);
                  }
          '''
          if text.count(old) != 1:
              raise SystemExit("Expected exactly one animation completion catch block")
          path.write_text(text.replace(old, new), encoding="utf-8")
          Path(".github/workflows/one-time-animation-fallback.yml").unlink()

      - name: Commit fix and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/org/enthusia/tags/daily/DailyService.java .github/workflows/one-time-animation-fallback.yml
          git commit -m "Fallback to static daily menu after animation scheduling failure"
          git push origin HEAD:agent/daily-live-hardening
