name: One-time daily recovery fix

on:
  push:
    branches:
      - agent/daily-live-hardening

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply one-time daily recovery patch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/daily-live-hardening
          fetch-depth: 0

      - name: Apply targeted recovery fix
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/main/java/org/enthusia/tags/daily/DailyService.java")
          text = path.read_text(encoding="utf-8")

          old = '''        BalanceLookup balance = lookupBalance(playerId, currentDate);
                  if (!balance.available()) {
                      return DailyClaimOutcome.failure(balance.failureMessage());
                  }
          '''
          new = '''        BalanceLookup balance = lookupBalance(playerId, currentDate);
                  if (!balance.available()) {
                      failReservationSafely(playerId, currentDate,
                          "Player unavailable before Vault balance lookup");
                      return DailyClaimOutcome.failure(balance.failureMessage());
                  }
          '''
          if text.count(old) != 1:
              raise SystemExit("Expected exactly one pre-Vault balance block")
          text = text.replace(old, new)

          old_catch = '''        } catch (SQLException ex) {
                      failReservationSafely(playerId, date,
                          "Balance lookup failed before Vault deposit: " + ex.getMessage());
                      return BalanceLookup.unavailable(
          '''
          new_catch = '''        } catch (SQLException ex) {
                      return BalanceLookup.unavailable(
          '''
          if text.count(old_catch) != 1:
              raise SystemExit("Expected exactly one balance lookup catch block")
          text = text.replace(old_catch, new_catch)

          path.write_text(text, encoding="utf-8")
          Path(".github/workflows/one-time-daily-recovery-fix.yml").unlink()

      - name: Commit targeted fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/org/enthusia/tags/daily/DailyService.java .github/workflows/one-time-daily-recovery-fix.yml
          git commit -m "Fix pre-Vault daily reservation recovery"
          git push origin HEAD:agent/daily-live-hardening
