name: Apply reward version-5 wiring

on:
  push:
    branches: [agent/reward-vault-rebalance-100]
    paths: [.github/workflows/apply-reward-v5-wiring.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reward-vault-rebalance-100
          fetch-depth: 0

      - name: Wire migration and money validation
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              if text.count(old) != 1:
                  raise SystemExit(f"Expected exactly one match for {label}, found {text.count(old)}")
              return text.replace(old, new, 1)

          migrator_path = Path("src/main/java/org/enthusia/tags/ConfigMigrator.java")
          migrator = migrator_path.read_text()
          migrator = replace_once(
              migrator,
              "    private static final int REWARDS_CONFIG_VERSION = 4;\n",
              "    private static final int REWARDS_CONFIG_VERSION = 5;\n",
              "rewards config version",
          )
          migrator = replace_once(
              migrator,
              '''        if ("rewards.yml".equals(resourceName) && existingVersion < REWARDS_CONFIG_VERSION) {
            return migrateRewardValues(config, report);
        }
        return false;
''',
              '''        if ("rewards.yml".equals(resourceName) && existingVersion < REWARDS_CONFIG_VERSION) {
            boolean changed = existingVersion < 4 && migrateRewardValues(config, report);
            if (existingVersion < 5) {
                changed |= RewardConfigV5Migration.migrateRewards(config, report);
            }
            return changed;
        }
        if ("messages.yml".equals(resourceName) && existingVersion < 3) {
            return RewardConfigV5Migration.migrateMessages(config, report);
        }
        return false;
''',
              "versioned reward and message migration",
          )
          migrator_path.write_text(migrator)

          service_path = Path("src/main/java/org/enthusia/tags/rewards/RewardService.java")
          service = service_path.read_text()
          service = replace_once(
              service,
              '''            case MONEY -> !Double.isFinite(amount) || amount <= 0D
                ? "money amount must be finite and greater than zero" : null;
''',
              '''            case MONEY -> RewardMoneyPolicy.validationError(amount);
''',
              "reward money validation",
          )
          service_path.write_text(service)

          Path(".github/workflows/apply-reward-v5-wiring.yml").unlink()

      - name: Commit and push final source wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Wire reward version-5 migration and payout limit"
          git push origin HEAD:agent/reward-vault-rebalance-100
