name: Apply reward rebalance through PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/reward-vault-rebalance'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reward-vault-rebalance
          fetch-depth: 0

      - name: Run the audited transformation
        shell: python
        run: |
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/apply-reward-vault-rebalance.yml').read_text().splitlines()
          start = workflow.index('        run: |') + 1
          end = workflow.index('      - name: Commit and push final changes')
          code = textwrap.dedent('\n'.join(workflow[start:end]))
          exec(compile(code, 'reward-rebalance-transform', 'exec'))
          Path('.github/workflows/apply-reward-vault-rebalance-pr.yml').unlink()

      - name: Commit and push final changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore Vault reward payouts and rebalance raw gold"
          git push origin HEAD:agent/reward-vault-rebalance
