name: WP06 One-Shot Accepted Handoff Recovery

on:
  push:
    branches:
      - agent/wp-06-loreitems-integration

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/wp-06-loreitems-integration
          fetch-depth: 0

      - name: Apply assertion-guarded recovery patch
        run: python3 tools/wp06_recovery_patch.py

      - name: Remove one-shot helper and workflow
        run: |
          rm tools/wp06_recovery_patch.py
          rm .github/workflows/wp06-recovery-one-shot.yml

      - name: Commit exact patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/org/enthusia/tags/rewards/RewardService.java \
            src/main/java/org/enthusia/tags/rewards/RewardStorage.java \
            src/main/java/org/enthusia/tags/rewards/loreitems/LoreItemHandoffStore.java \
            src/main/java/org/enthusia/tags/rewards/loreitems/LoreItemRewardRuntime.java \
            src/test/java/org/enthusia/tags/rewards/loreitems/LoreItemHandoffStoreTest.java \
            src/test/java/org/enthusia/tags/rewards/loreitems/LoreItemHandoffCoordinatorTest.java \
            src/test/java/org/enthusia/tags/rewards/loreitems/LoreItemOperationKeyTest.java \
            tools/wp06_recovery_patch.py .github/workflows/wp06-recovery-one-shot.yml
          git diff --cached --exit-code && { echo "Expected recovery patch produced no changes" >&2; exit 1; } || true
          git commit -m "WP-06: recover accepted LoreItems handoffs into reward state"
          git push origin HEAD:agent/wp-06-loreitems-integration
