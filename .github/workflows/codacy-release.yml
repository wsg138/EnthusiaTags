name: Release Codacy assertion

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  codacy:
    if: github.head_ref == 'agent/anti-farm-natural-daily-ip'
    runs-on: ubuntu-latest
    steps:
      - name: Assert zero analyzed Codacy issues
        shell: bash
        run: |
          set -euo pipefail
          URL='https://api.codacy.com/api/v3/analysis/organizations/gh/wsg138/repositories/EnthusiaTags/pull-requests/11/issues?limit=100'
          for attempt in $(seq 1 60); do
            curl --fail --silent --show-error --location "$URL" --output /tmp/codacy.json
            if python3 - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/codacy.json').read_text())
          raise SystemExit(0 if payload.get('analyzed') is True else 1)
          PY
            then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              cat /tmp/codacy.json
              exit 1
            fi
            sleep 10
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/codacy.json').read_text())
          issues = payload.get('data', [])
          total = payload.get('pagination', {}).get('total', len(issues))
          print(f'analyzed={payload.get("analyzed")} total={total}')
          for issue in issues:
              print(json.dumps(issue, sort_keys=True))
          if total != 0:
              raise SystemExit(f'Codacy reported {total} new issues')
          PY
