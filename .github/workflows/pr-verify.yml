name: EnthusiaTags verification
on:
  push:
    branches-ignore: ['test-jars-*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: EnthusiaTags-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact checkout
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Validate SPEAR requirements and tooling
        run: |
          node tools/spear/ears.mjs docs/requirements.md
          node --test tools/spear/*.test.mjs
      - name: Bootstrap checksum-verified LoreItems release
        run: bash tools/bootstrap_loreitems_release.sh
      - name: Build pinned companion renderer and fetch presence contract
        run: |
          python3 -m pip install --require-hashes -r tools/ci/requirements.txt
          python3 -m unittest discover -s tools/ci -p 'test_*.py'
          bash tools/ci/bootstrap_companions.sh
      - name: Clean build and verification
        run: mvn -B -ntp clean verify
      - name: Exercise read-only SQLite using the final shaded jar
        run: java --class-path target/EnthusiaTags.jar tools/ci/org/enthusia/tools/SQLiteArtifactProbe.java

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: EnthusiaTags-test-reports-${{ github.event.pull_request.head.sha || github.sha }}
          path: target/surefire-reports/
          if-no-files-found: error
          retention-days: 14
      - name: Upload verified testing artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: EnthusiaTags-test-jar-${{ github.event.pull_request.head.sha || github.sha }}
          path: target/*.jar
          if-no-files-found: error
          retention-days: 14

  codacy-gate:
    if: github.event_name == 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Require a successful exact-head Codacy result
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash tools/check_codacy.sh
