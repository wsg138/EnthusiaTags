name: Address anti-farm review findings v2

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/anti-farm-natural-daily-ip'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/anti-farm-natural-daily-ip
          fetch-depth: 0

      - name: Apply validated review fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def block(lines):
              return "\n".join(lines) + "\n"

          daily = Path('src/main/java/org/enthusia/tags/daily/DailyService.java')
          source = daily.read_text()
          start = source.index('    private String playerIp(Player player) {')
          end = source.index('    private void releaseIpReservationSafely', start)
          source = source[:start] + block([
              '    private String playerIp(Player player) {',
              '        java.net.InetSocketAddress socketAddress = player.getAddress();',
              '        java.net.InetAddress address = socketAddress == null ? null : socketAddress.getAddress();',
              '        return address == null ? "" : address.getHostAddress();',
              '    }',
              ''
          ]) + source[end:]
          daily.write_text(source)

          storage = Path('src/main/java/org/enthusia/tags/rewards/NaturalBlockStorage.java')
          source = storage.read_text()
          start = source.index('    @Override\n    public void close() throws SQLException {')
          end = source.index('    record BlockKey', start)
          source = source[:start] + block([
              '    @Override',
              '    public void close() throws SQLException {',
              '        executor.shutdown();',
              '        SQLException failure = null;',
              '        boolean stopped = false;',
              '        try {',
              '            stopped = executor.awaitTermination(5, TimeUnit.SECONDS);',
              '            if (!stopped) {',
              '                executor.shutdownNow();',
              '                stopped = executor.awaitTermination(5, TimeUnit.SECONDS);',
              '            }',
              '        } catch (InterruptedException ex) {',
              '            Thread.currentThread().interrupt();',
              '            executor.shutdownNow();',
              '            failure = new SQLException("Interrupted while stopping natural block storage", ex);',
              '        } finally {',
              '            try {',
              '                connection.close();',
              '            } catch (SQLException closeFailure) {',
              '                if (failure == null) {',
              '                    failure = closeFailure;',
              '                } else {',
              '                    failure.addSuppressed(closeFailure);',
              '                }',
              '            }',
              '        }',
              '        if (!stopped && failure == null) {',
              '            failure = new SQLException("Natural block storage worker did not stop safely");',
              '        }',
              '        if (failure != null) {',
              '            throw failure;',
              '        }',
              '    }',
              ''
          ]) + source[end:]
          storage.write_text(source)

          natural_tracker = Path('src/main/java/org/enthusia/tags/rewards/NaturalBlockTracker.java')
          source = natural_tracker.read_text()
          if 'import org.bukkit.Bukkit;\n' not in source:
              source = source.replace('import org.bukkit.Material;\n', 'import org.bukkit.Bukkit;\nimport org.bukkit.Material;\n', 1)
          start = source.index('    @EventHandler(priority = EventPriority.MONITOR, ignoreCancelled = true)\n    public void onBreak(BlockBreakEvent event) {')
          end = source.index('    @EventHandler(priority = EventPriority.MONITOR, ignoreCancelled = true)\n    public void onPistonExtend', start)
          source = source[:start] + block([
              '    @EventHandler(priority = EventPriority.MONITOR, ignoreCancelled = true)',
              '    public void onBreak(BlockBreakEvent event) {',
              '        Block block = event.getBlock();',
              '        Material material = block.getType();',
              '        if (!NaturalBlockPolicy.isTracked(material)) {',
              '            return;',
              '        }',
              '        var playerId = event.getPlayer().getUniqueId();',
              '        storage.consumePlaced(key(block), material).whenComplete((playerPlaced, throwable) -> {',
              '            if (throwable != null) {',
              '                logFailure("check natural block origin", throwable);',
              '                return;',
              '            }',
              '            if (!playerPlaced && plugin.isEnabled()) {',
              '                Bukkit.getScheduler().runTask(plugin, () ->',
              '                    rewardService.incrementCounter(playerId,',
              '                        NaturalBlockPolicy.counterKey(material), 1L));',
              '            }',
              '        });',
              '    }',
              ''
          ]) + source[end:]
          natural_tracker.write_text(source)

          limiter = Path('src/main/java/org/enthusia/tags/rewards/KillFarmLimiter.java')
          source = limiter.read_text()
          anchor = '    enum Reason {\n'
          if source.count(anchor) != 1:
              raise SystemExit('KillFarmLimiter anchor mismatch')
          source = source.replace(anchor, block([
              '    static boolean isExpired(String encoded, long now, long windowMillis) {',
              '        KillRecord record = KillRecord.parse(encoded);',
              '        long safeWindow = Math.max(1L, windowMillis);',
              '        return record == null || now < record.windowStartedAt()',
              '            || now - record.windowStartedAt() >= safeWindow;',
              '    }',
              ''
          ]) + anchor, 1)
          limiter.write_text(source)

          service = Path('src/main/java/org/enthusia/tags/rewards/RewardService.java')
          source = service.read_text()
          start = source.index('    private long computeProgress(Player player, RewardCriterion criterion) {')
          end = source.index('    private long computeSourceProgress(Player player, RewardCriterion criterion) {', start)
          source = source[:start] + block([
              '    private long computeProgress(Player player, RewardCriterion criterion) {',
              '        if (criterion.getType() == RewardCriterionType.KILLS_TOTAL) {',
              '            return getCounter(player.getUniqueId(), KillFarmLimiter.TRUSTED_KILL_COUNTER);',
              '        }',
              '        if (criterion.getType() == RewardCriterionType.BLOCK_MINED',
              '            && NaturalBlockPolicy.isTracked(criterion.getMaterial())) {',
              '            return getCounter(player.getUniqueId(), NaturalBlockPolicy.counterKey(criterion.getMaterial()));',
              '        }',
              '        if (criterion.getSourceType() == RewardSourceType.CUSTOM_COUNTER) {',
              '            String key = criterion.getKey();',
              '            if ("diamond_ore_mined".equals(key)) {',
              '                return getCounter(player.getUniqueId(), NaturalBlockPolicy.counterKey(Material.DIAMOND_ORE))',
              '                    + getCounter(player.getUniqueId(), NaturalBlockPolicy.counterKey(Material.DEEPSLATE_DIAMOND_ORE));',
              '            }',
              '            if ("iron_ore_mined".equals(key)) {',
              '                return getCounter(player.getUniqueId(), NaturalBlockPolicy.counterKey(Material.IRON_ORE))',
              '                    + getCounter(player.getUniqueId(), NaturalBlockPolicy.counterKey(Material.DEEPSLATE_IRON_ORE));',
              '            }',
              '        }',
              '        if (criterion.getSourceType() != RewardSourceType.LEGACY) {',
              '            return computeSourceProgress(player, criterion);',
              '        }',
              '        return computeLegacyProgress(player, criterion);',
              '    }',
              ''
          ]) + source[end:]
          anchor = '    public String getState(UUID playerId, String key) {\n'
          if source.count(anchor) != 1:
              raise SystemExit('RewardService state anchor mismatch')
          source = source.replace(anchor, block([
              '    public Set<String> stateKeysWithPrefix(UUID playerId, String prefix) {',
              '        if (!isAvailable()) {',
              '            return Set.of();',
              '        }',
              '        RewardPlayerState state = getLoadedState(playerId);',
              '        return state == null ? Set.of() : state.stateKeysWithPrefix(prefix);',
              '    }',
              '',
              '    public void removeState(UUID playerId, String key) {',
              '        if (!isAvailable()) {',
              '            return;',
              '        }',
              '        RewardPlayerState state = getLoadedState(playerId);',
              '        if (state != null && state.isLoaded()) {',
              '            state.removeState(key);',
              '        }',
              '    }',
              ''
          ]) + anchor, 1)
          service.write_text(source)

          tracker = Path('src/main/java/org/enthusia/tags/rewards/RewardTracker.java')
          source = tracker.read_text()
          start = source.index('    public void start(JavaPlugin schedulingPlugin) {')
          end = source.index('    public void stop() {', start)
          source = source[:start] + block([
              '    public void start(JavaPlugin schedulingPlugin) {',
              '        if (playtimeTask != null) {',
              '            return;',
              '        }',
              '        for (Player online : Bukkit.getOnlinePlayers()) {',
              '            initializeProtectedCountersWhenLoaded(online, 0);',
              '        }',
              '        playtimeTask = Bukkit.getScheduler().runTaskTimer(',
              '            schedulingPlugin, this::tickPlaytime, 20L, 1200L);',
              '    }',
              ''
          ]) + source[end:]
          start = source.index('    private void initializeProtectedCounters(Player player) {')
          end = source.index('    private long clamp(long value, long minimum, long maximum) {', start)
          source = source[:start] + block([
              '    private void initializeProtectedCounters(Player player) {',
              '        UUID playerId = player.getUniqueId();',
              '        if (!"1".equals(rewardService.getState(playerId, KillFarmLimiter.INITIALIZED_STATE))) {',
              '            rewardService.setCounter(playerId, KillFarmLimiter.TRUSTED_KILL_COUNTER,',
              '                player.getStatistic(Statistic.PLAYER_KILLS));',
              '            rewardService.setState(playerId, KillFarmLimiter.INITIALIZED_STATE, "1");',
              '        }',
              '        for (Material material : NaturalBlockPolicy.trackedMaterials()) {',
              '            String marker = NaturalBlockPolicy.initializedState(material);',
              '            if ("1".equals(rewardService.getState(playerId, marker))) {',
              '                continue;',
              '            }',
              '            rewardService.setCounter(playerId, NaturalBlockPolicy.counterKey(material),',
              '                player.getStatistic(Statistic.MINE_BLOCK, material));',
              '            rewardService.setState(playerId, marker, "1");',
              '        }',
              '        pruneExpiredKillPairs(playerId);',
              '    }',
              '',
              '    private void pruneExpiredKillPairs(UUID playerId) {',
              '        long windowHours = clamp(plugin.getConfig().getLong(',
              '            KILL_CONFIG + "victim-window-hours", 24L), 1L, 168L);',
              '        long windowMillis = windowHours * 3_600_000L;',
              '        long now = System.currentTimeMillis();',
              '        for (String key : rewardService.stateKeysWithPrefix(',
              '            playerId, KillFarmLimiter.PAIR_STATE_PREFIX)) {',
              '            if (KillFarmLimiter.isExpired(',
              '                rewardService.getState(playerId, key), now, windowMillis)) {',
              '                rewardService.removeState(playerId, key);',
              '            }',
              '        }',
              '    }',
              ''
          ]) + source[end:]
          tracker.write_text(source)

          Path('.github/workflows/address-review.yml').unlink(missing_ok=True)
          Path('.github/workflows/address-review-v2.yml').unlink(missing_ok=True)
          PY

      - name: Commit validated fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Address anti-farm review findings"
          git push origin HEAD:agent/anti-farm-natural-daily-ip
