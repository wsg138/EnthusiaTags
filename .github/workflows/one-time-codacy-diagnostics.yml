name: One-time Codacy diagnostics

on:
  push:
    branches:
      - agent/daily-live-hardening

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.head_commit.message == 'Run one-time Codacy issue diagnostics'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/daily-live-hardening
          fetch-depth: 0

      - name: Fetch exact Codacy PR issues
        run: |
          set -euo pipefail
          API='https://api.codacy.com/api/v3/analysis/organizations/gh/wsg138/repositories/EnthusiaTags/pull-requests/6/issues?status=new&limit=100'
          curl --fail --silent --show-error --location \
            --header 'Accept: application/json' \
            "$API" > /tmp/codacy-issues.json
          echo '=== Codacy PR issue response ==='
          jq '.' /tmp/codacy-issues.json
          echo '=== Compact issue list ==='
          jq -r '.data[] | [
            (.commitIssue.patternInfo.id // .commitIssue.patternId // "unknown-pattern"),
            (.commitIssue.patternInfo.level // .commitIssue.level // "unknown-level"),
            (.commitIssue.patternInfo.category // .commitIssue.category // "unknown-category"),
            (.commitIssue.filePath // "unknown-file"),
            ((.commitIssue.lineNumber // .commitIssue.line // 0) | tostring),
            (.commitIssue.message // .commitIssue.patternInfo.title // "")
          ] | @tsv' /tmp/codacy-issues.json

      - name: Remove diagnostic workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-codacy-diagnostics.yml
          git commit -m "Remove one-time Codacy diagnostics"
          git push origin HEAD:agent/daily-live-hardening
