name: Apply hardening audit fixes

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/anti-farm-natural-daily-ip'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/anti-farm-natural-daily-ip
          fetch-depth: 0

      - name: Apply audit fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          reward = Path('src/main/java/org/enthusia/tags/rewards/RewardService.java')
          source = reward.read_text()
          progress_start = source.index('    private long computeProgress(Player player, RewardCriterion criterion) {')
          source_start = source.index('    private long computeSourceProgress(Player player, RewardCriterion criterion) {', progress_start)
          legacy_start = source.index('    private long computeLegacyProgress(Player player, RewardCriterion criterion) {', source_start)
          source_method = source[source_start:legacy_start]
          switch_start = source_method.index('        return switch (criterion.getSourceType()) {')
          replacement = '''    private long computeProgress(Player player, RewardCriterion criterion) {
              if (criterion.getType() == RewardCriterionType.KILLS_TOTAL) {
                  return getCounter(player.getUniqueId(), KillFarmLimiter.TRUSTED_KILL_COUNTER);
              }
              if (criterion.getType() == RewardCriterionType.BLOCK_MINED
                  && NaturalBlockPolicy.isTracked(criterion.getMaterial())) {
                  return getCounter(player.getUniqueId(), NaturalBlockPolicy.counterKey(criterion.getMaterial()));
              }
              if (criterion.getSourceType() != RewardSourceType.LEGACY) {
                  return computeSourceProgress(player, criterion);
              }
              return computeLegacyProgress(player, criterion);
          }

          private long computeSourceProgress(Player player, RewardCriterion criterion) {
          ''' + source_method[switch_start:]
          reward.write_text(source[:progress_start] + replacement + source[legacy_start:])

          daily = Path('src/main/java/org/enthusia/tags/daily/DailyService.java')
          source = daily.read_text()
          enable_start = source.index('        storage = new DailyStorage(new File(plugin.getDataFolder(), "daily.db"));')
          enable_end = source.index('        vault.setup();', enable_start) + len('        vault.setup();')
          enable_replacement = '''        storage = new DailyStorage(new File(plugin.getDataFolder(), "daily.db"));
              try {
                  ipStorage = new DailyIpStorage(new File(plugin.getDataFolder(), "daily-ip.db"));
              } catch (SQLException ex) {
                  try {
                      storage.close();
                  } catch (SQLException closeFailure) {
                      ex.addSuppressed(closeFailure);
                  }
                  storage = null;
                  throw ex;
              }
              vault.setup();'''
          source = source[:enable_start] + enable_replacement + source[enable_end:]

          reserve_start = source.index('        if (!storage.reserve(playerId, currentDate, amount)) {')
          reserve_end = source.index('\n\n        BalanceLookup balance', reserve_start)
          reserve_replacement = '''        boolean dailyReserved;
              try {
                  dailyReserved = storage.reserve(playerId, currentDate, amount);
              } catch (SQLException ex) {
                  releaseIpReservationSafely(playerId, currentDate, ipAddress, enforceIp);
                  throw ex;
              }
              if (!dailyReserved) {
                  return reservationConflict(playerId, currentDate);
              }'''
          source = source[:reserve_start] + reserve_replacement + source[reserve_end:]
          daily.write_text(source)

          natural = Path('src/main/java/org/enthusia/tags/rewards/NaturalBlockStorage.java')
          source = natural.read_text()
          close_start = source.index('    @Override\n    public void close() throws SQLException {')
          record_start = source.index('    record BlockKey', close_start)
          close_replacement = '''    @Override
          public void close() throws SQLException {
              executor.shutdown();
              boolean stopped = false;
              try {
                  stopped = executor.awaitTermination(5, TimeUnit.SECONDS);
                  if (!stopped) {
                      executor.shutdownNow();
                      stopped = executor.awaitTermination(5, TimeUnit.SECONDS);
                  }
              } catch (InterruptedException ex) {
                  Thread.currentThread().interrupt();
                  executor.shutdownNow();
              }
              if (!stopped) {
                  throw new SQLException("Natural block storage worker did not stop safely");
              }
              connection.close();
          }

          '''
          natural.write_text(source[:close_start] + close_replacement + source[record_start:])

          Path('.github/workflows/fix-hardening.yml').unlink()
          PY

      - name: Commit audit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden migration and reservation boundaries"
          git push origin HEAD:agent/anti-farm-natural-daily-ip
