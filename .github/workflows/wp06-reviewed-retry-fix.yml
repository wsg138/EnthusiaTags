name: WP-06 reviewed retry remediation

on:
  push:
    branches: [agent/wp-06-loreitems-integration]

permissions:
  contents: write

jobs:
  remediate:
    if: github.event.head_commit.message == 'WP-06: arm reviewed-retry remediation'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/wp-06-loreitems-integration
          fetch-depth: 0

      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify exclusive live head
        shell: bash
        run: |
          set -euo pipefail
          initial="$(git rev-parse HEAD)"
          remote="$(git ls-remote origin refs/heads/agent/wp-06-loreitems-integration | cut -f1)"
          printf 'initial=%s\nremote=%s\n' "$initial" "$remote"
          test "$initial" = "$remote"
          printf '%s' "$initial" > /tmp/wp06-initial-head

      - name: Apply reviewed recovery fix and regression coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          storage = Path('src/main/java/org/enthusia/tags/rewards/RewardStorage.java')
          text = storage.read_text()
          old = '''    private static boolean isRecoverableLoreItemStatus(RewardStatus status) {
              return status == RewardStatus.CLAIM_PENDING || status == RewardStatus.DELIVERY_FAILED;
          }
          '''
          new = '''    private static boolean isRecoverableLoreItemStatus(RewardStatus status) {
              return status == RewardStatus.CLAIM_PENDING
                  || status == RewardStatus.DELIVERY_FAILED
                  || status == RewardStatus.REQUIRES_RECONCILIATION;
          }
          '''
          if text.count(old) != 1:
              raise SystemExit('RewardStorage recovery-status assertion failed')
          storage.write_text(text.replace(old, new))

          test = Path('src/test/java/org/enthusia/tags/rewards/RewardStorageLoreItemRecoveryTest.java')
          text = test.read_text()
          import_anchor = 'import org.enthusia.tags.PerformanceMonitor;\n'
          imports = '''import org.enthusia.tags.PerformanceMonitor;
          import org.enthusia.tags.rewards.loreitems.LoreItemHandoffCoordinator;
          import org.enthusia.tags.rewards.loreitems.LoreItemHandoffRecord;
          import org.enthusia.tags.rewards.loreitems.LoreItemHandoffState;
          import org.enthusia.tags.rewards.loreitems.LoreItemHandoffStore;
          import org.enthusia.tags.rewards.loreitems.LoreItemsGatewayResult;
          '''
          if text.count(import_anchor) != 1:
              raise SystemExit('test import assertion failed')
          text = text.replace(import_anchor, imports)
          text = text.replace('import java.util.UUID;\n', 'import java.util.UUID;\nimport java.util.concurrent.CompletableFuture;\n')

          class_anchor = 'class RewardStorageLoreItemRecoveryTest {\n'
          constants = '''class RewardStorageLoreItemRecoveryTest {
              private static final UUID PLAYER = UUID.fromString("aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee");
          '''
          if text.count(class_anchor) != 1:
              raise SystemExit('test class assertion failed')
          text = text.replace(class_anchor, constants)
          text = text.replace('    private static final String FINGERPRINT = "v1:lore-item:hourglass";\n',
                              '    private static final String DEFINITION = "hourglass";\n'
                              '    private static final String FINGERPRINT = "v1:lore-item:hourglass";\n')
          text = text.replace('        UUID playerId = UUID.fromString("aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee");\n',
                              '        UUID playerId = PLAYER;\n')
          action_block = '''        RewardAction action = new RewardAction(
              ACTION,
              RewardActionType.LORE_ITEM,
              "hourglass",
              0.0D,
              "Hourglass",
              null,
              0,
              null,
              List.of(),
              true);
          '''
          if text.count(action_block) != 1:
              raise SystemExit('existing action fixture assertion failed')
          text = text.replace(action_block, '        RewardAction action = loreAction();\n')

          addition = '''

              @Test
              void staffRetryCanFinalizePreviouslyReviewedLoreItemAction(@TempDir Path tempDir) throws Exception {
                  RewardAction action = loreAction();
                  RewardStorage storage = new RewardStorage(
                      tempDir.resolve("reviewed-retry-rewards.db").toFile(),
                      new PerformanceMonitor(null));
                  storage.init();
                  try (LoreItemHandoffStore handoffs = new LoreItemHandoffStore(
                      tempDir.resolve("reviewed-retry-handoffs.db"))) {
                      storage.saveActionLedgerNow(
                          PLAYER, REWARD, action, FINGERPRINT, RewardStatus.CLAIM_PENDING, null, null);
                      storage.saveActionLedgerNow(
                          PLAYER, REWARD, action, FINGERPRINT, RewardStatus.REQUIRES_RECONCILIATION, null,
                          "LoreItems review required");

                      long now = System.currentTimeMillis();
                      LoreItemHandoffRecord prepared = handoffs.prepare(
                          PLAYER, REWARD, ACTION, DEFINITION, now);
                      LoreItemHandoffRecord reviewed = handoffs.markReview(
                          prepared.externalOperationId(),
                          "UNKNOWN_DEFINITION",
                          "definition corrected before staff retry",
                          now);
                      assertEquals(LoreItemHandoffState.REVIEW, reviewed.state());

                      LoreItemHandoffRecord retried = handoffs.requestRetry(PLAYER, REWARD, ACTION, now);
                      assertEquals(LoreItemHandoffState.RETRY, retried.state());

                      LoreItemHandoffCoordinator coordinator = new LoreItemHandoffCoordinator(
                          handoffs,
                          (definitionKey, targetPlayer, operationId) -> {
                              assertEquals(DEFINITION, definitionKey);
                              assertEquals(PLAYER, targetPlayer);
                              assertEquals(prepared.externalOperationId(), operationId);
                              return CompletableFuture.completedFuture(new LoreItemsGatewayResult(
                                  LoreItemsGatewayResult.Disposition.ACCEPTED,
                                  "ACCEPTED_QUEUED",
                                  operationId,
                                  "accepted after staff retry"));
                          },
                          Runnable::run);
                      LoreItemHandoffRecord accepted = coordinator.handoff(
                          PLAYER, REWARD, ACTION, DEFINITION).toCompletableFuture().join();
                      assertEquals(LoreItemHandoffState.ACCEPTED, accepted.state());

                      assertTrue(storage.acceptLoreItemHandoffNow(
                          PLAYER, REWARD, action, FINGERPRINT, "accepted after staff retry"));
                      assertEquals(
                          RewardStatus.CLAIMED,
                          storage.loadActionLedgerNow(PLAYER, REWARD).get(ACTION).status());

                      storage.finalizeRewardNow(PLAYER, REWARD);
                      assertTrue(storage.loadNow(PLAYER).claims().contains(REWARD));
                      handoffs.markRewardFinalized(accepted.externalOperationId(), System.currentTimeMillis());
                      assertTrue(handoffs.loadByOperationId(accepted.externalOperationId()).rewardFinalized());
                  } finally {
                      storage.close();
                  }
              }

              private static RewardAction loreAction() {
                  return new RewardAction(
                      ACTION,
                      RewardActionType.LORE_ITEM,
                      DEFINITION,
                      0.0D,
                      "Hourglass",
                      null,
                      0,
                      null,
                      List.of(),
                      true);
              }
          '''
          if not text.endswith('\n}\n'):
              raise SystemExit('test file closing assertion failed')
          text = text[:-3] + addition + '\n}\n'
          test.write_text(text)
          PY

          git diff -- src/main/java/org/enthusia/tags/rewards/RewardStorage.java \
            src/test/java/org/enthusia/tags/rewards/RewardStorageLoreItemRecoveryTest.java

      - name: Validate production dependency and full Maven suite
        shell: bash
        run: |
          set -euo pipefail
          bash tools/bootstrap_loreitems_release.sh
          mvn --batch-mode --no-transfer-progress clean test package
          git checkout -- dependency-reduced-pom.xml || true
          git diff --check

      - name: Publish validated remediation
        shell: bash
        run: |
          set -euo pipefail
          initial="$(cat /tmp/wp06-initial-head)"
          git fetch origin agent/wp-06-loreitems-integration
          remote="$(git rev-parse origin/agent/wp-06-loreitems-integration)"
          test "$initial" = "$remote"
          git config user.name 'WP-06 package worker'
          git config user.email 'actions@users.noreply.github.com'
          git add src/main/java/org/enthusia/tags/rewards/RewardStorage.java \
            src/test/java/org/enthusia/tags/rewards/RewardStorageLoreItemRecoveryTest.java
          git commit -m 'WP-06: allow reviewed LoreItems retry recovery'
          git push origin HEAD:agent/wp-06-loreitems-integration
