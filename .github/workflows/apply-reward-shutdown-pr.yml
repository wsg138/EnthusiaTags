name: Apply reward shutdown fix in PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/fix-reward-shutdown-deadlock'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-reward-shutdown-deadlock
          fetch-depth: 0

      - name: Execute reviewed patch
        shell: python
        run: |
          from pathlib import Path

          workflow = Path('.github/workflows/build.yml')
          lines = workflow.read_text().splitlines()
          start = next(index + 1 for index, line in enumerate(lines)
                       if line.strip() == 'run: |'
                       and index > 0
                       and 'shell: python' in lines[index - 1])
          script_lines = []
          for line in lines[start:]:
              if line.startswith('      - name:'):
                  break
              script_lines.append(line[10:] if line.startswith('          ') else '')
          script = '\n'.join(script_lines)
          exec(compile(script, 'embedded-reward-shutdown-patch.py', 'exec'), {'__name__': '__main__'})

          Path('.github/workflows/apply-reward-shutdown-pr.yml').unlink(missing_ok=True)
          Path('.github/reward-shutdown-fix.trigger').unlink(missing_ok=True)

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix reward storage shutdown deadlock"
          git push origin HEAD:agent/fix-reward-shutdown-deadlock
