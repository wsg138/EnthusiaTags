name: Publish latest build

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: enthusiatags-latest-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Bootstrap pinned production LoreItems release
        run: bash tools/bootstrap_loreitems_release.sh

      - name: Bootstrap pinned companion sources
        run: |
          python3 -m pip install --require-hashes -r tools/ci/requirements.txt
          python3 -m unittest discover -s tools/ci -p 'test_*.py'
          bash tools/ci/bootstrap_companions.sh

      - name: Test and package
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Exercise read-only SQLite using the final shaded jar
        run: java --class-path target/EnthusiaTags.jar tools/ci/org/enthusia/tools/SQLiteArtifactProbe.java

      - name: Update rolling prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest target/EnthusiaTags.jar --clobber
          else
            gh release create latest target/EnthusiaTags.jar --prerelease --title "Latest development build" --notes "Automatically updated from main."
          fi
