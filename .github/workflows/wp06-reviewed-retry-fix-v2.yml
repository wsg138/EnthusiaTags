name: WP-06 reviewed retry remediation v2

on:
  push:
    branches: [agent/wp-06-loreitems-integration]

permissions:
  contents: write

jobs:
  remediate:
    if: github.event.head_commit.message == 'WP-06 run reviewed-retry remediation'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/wp-06-loreitems-integration
          fetch-depth: 0
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify exclusive head
        run: |
          set -euo pipefail
          initial="$(git rev-parse HEAD)"
          remote="$(git ls-remote origin refs/heads/agent/wp-06-loreitems-integration | cut -f1)"
          test "$initial" = "$remote"
          printf '%s' "$initial" > /tmp/initial-head
      - name: Apply reviewed fix
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/wp06_patch.py
          python3 /tmp/wp06_patch.py
          git diff --check
      - name: Validate
        run: |
          set -euo pipefail
          bash tools/bootstrap_loreitems_release.sh
          mvn --batch-mode --no-transfer-progress clean test package
          git checkout -- dependency-reduced-pom.xml || true
          git diff --check
      - name: Publish validated fix
        run: |
          set -euo pipefail
          initial="$(cat /tmp/initial-head)"
          git fetch origin agent/wp-06-loreitems-integration
          test "$initial" = "$(git rev-parse origin/agent/wp-06-loreitems-integration)"
          git config user.name 'WP-06 package worker'
          git config user.email 'actions@users.noreply.github.com'
          git add src/main/java/org/enthusia/tags/rewards/RewardStorage.java src/test/java/org/enthusia/tags/rewards/RewardStorageLoreItemRecoveryTest.java
          git commit -m 'WP-06: allow reviewed LoreItems retry recovery'
          git push origin HEAD:agent/wp-06-loreitems-integration
