name: Sentinel artifact

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Verify exact checkout
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"

      - name: Set up Java 25
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Bootstrap pinned LoreItems release
        run: bash tools/bootstrap_loreitems_release.sh

      - name: Build pinned companion renderer and fetch presence contract
        run: |
          python3 -m pip install --require-hashes -r tools/ci/requirements.txt
          bash tools/ci/bootstrap_companions.sh

      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress clean test package

      - name: Prepare stable Sentinel artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f target/EnthusiaTags.jar
          rm -rf /tmp/sentinel-plugin
          mkdir -p /tmp/sentinel-plugin
          cp target/EnthusiaTags.jar /tmp/sentinel-plugin/plugin.jar

      - name: Upload stable Sentinel artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sentinel-plugin
          path: /tmp/sentinel-plugin/
          if-no-files-found: error
          retention-days: 30
