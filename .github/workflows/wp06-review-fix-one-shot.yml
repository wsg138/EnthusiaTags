name: WP06 One-Shot Review Fixes

on:
  push:
    branches:
      - agent/wp-06-loreitems-integration

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact checkpoint head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify canonical branch has not moved
        shell: bash
        env:
          CHECKPOINT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin refs/heads/agent/wp-06-loreitems-integration | awk '{print $1}')"
          test "${remote_head}" = "${CHECKPOINT_SHA}"

      - name: Apply assertion-guarded current-head review fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/wp06_patch_bootstrap.py
          python3 -m py_compile tools/wp06_review_fix_patch.py
          python3 tools/wp06_review_fix_patch.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/main/java/org/enthusia/tags/rewards/loreitems/LoreItemRewardRuntime.java")
          path.write_text(path.read_text(encoding="utf-8").rstrip() + "\n", encoding="utf-8")
          PY

      - name: Validate exact remediation tree
        shell: bash
        run: |
          set -euo pipefail
          bash tools/bootstrap_loreitems_release.sh
          mvn --batch-mode --no-transfer-progress clean test package
          git restore --worktree --source=HEAD -- dependency-reduced-pom.xml 2>/dev/null || rm -f dependency-reduced-pom.xml
          git diff --check

      - name: Commit validated source remediation
        id: remediation
        shell: bash
        run: |
          set -euo pipefail
          # The Actions token cannot update workflow files. The intended publish-latest
          # change was included in validation above; restore it here so the connector
          # can publish that workflow change after the validated source commit lands.
          git restore --worktree --source=HEAD -- .github/workflows/publish-latest.yml
          rm -f tools/wp06_patch_bootstrap.py
          rm -f tools/wp06_review_fix_patch.py
          rm -f tools/wp06_review_guardrail_patch.py
          rm -rf tools/__pycache__
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Expected WP-06 review remediation produced no changes" >&2
            exit 1
          fi
          git commit -m "WP-06: resolve independent review findings"
          source_sha="$(git rev-parse HEAD)"
          echo "source_sha=${source_sha}" >> "$GITHUB_OUTPUT"

      - name: Record exact remediation checkpoint
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.remediation.outputs.source_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path("docs/wp-06-loreitems-integration-handoff.md")
          text = path.read_text(encoding="utf-8")
          text = text.replace("- Status: `IN_PROGRESS`.", "- Status: `IN_REVIEW`.", 1)
          old = "- Exact pre-remediation branch head: `ef70f0ba68d2bb2fcae5d8687cec2e7a48f2b122`."
          new = f"- Exact implementation/remediation head: `{os.environ['SOURCE_SHA']}`."
          if old not in text:
              raise SystemExit("handoff exact-head marker missing")
          text = text.replace(old, new, 1)
          marker = "## Exact next action\n"
          evidence = (
              "## Current-session validation\n"
              "- The one-shot remediation workflow applied the accepted review fixes on the exact checkpoint tree, "
              "then ran `tools/bootstrap_loreitems_release.sh`, `mvn --batch-mode --no-transfer-progress clean test package`, "
              "and `git diff --check` successfully before creating the implementation commit.\n"
              "- The publish-latest workflow fix was part of that validated tree but is intentionally published through the GitHub connector because the Actions token cannot modify workflow files.\n"
              "- Exact-head PR Build/Codacy and independent review still must be re-evaluated after the connector publishes the workflow fix and removes this one-shot runner; no later gate is pre-claimed here.\n\n"
          )
          if marker not in text:
              raise SystemExit("handoff next-action marker missing")
          text = text.replace(marker, evidence + marker, 1)
          text = text.replace(
              "Apply the accepted review remediation on this same branch, remove the temporary one-shot helpers, run Maven/package validation, and publish an exact implementation checkpoint.",
              "Publish the validated publish-latest workflow fix through the connector, remove this one-shot workflow, then require exact-head Build/Codacy and a fresh independent review before normal merge of PR #15.",
              1,
          )
          path.write_text(text, encoding="utf-8")
          PY
          git add docs/wp-06-loreitems-integration-handoff.md
          git commit -m "WP-06: checkpoint review remediation"

      - name: Publish only if canonical head is unchanged
        shell: bash
        env:
          CHECKPOINT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin refs/heads/agent/wp-06-loreitems-integration | awk '{print $1}')"
          test "${remote_head}" = "${CHECKPOINT_SHA}"
          git push origin HEAD:agent/wp-06-loreitems-integration
