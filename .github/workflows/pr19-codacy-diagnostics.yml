name: PR Codacy diagnostics
on:
  push:
    branches:
      - review/pr19-codacy-diagnostics
permissions:
  contents: read
jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query public Codacy PR issues API
        run: |
          python3 - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          pull_request = 20
          base = f"https://api.codacy.com/api/v3/analysis/organizations/gh/wsg138/repositories/EnthusiaTags/pull-requests/{pull_request}/issues"
          cursor = None
          issues = []
          while True:
              params = {"status": "new", "limit": "100"}
              if cursor:
                  params["cursor"] = cursor
              url = base + "?" + urllib.parse.urlencode(params)
              with urllib.request.urlopen(url, timeout=30) as response:
                  payload = json.load(response)
              issues.extend(payload.get("data", []))
              cursor = (payload.get("pagination") or {}).get("cursor")
              if not cursor:
                  break
          output_name = f"codacy-pr{pull_request}-issues.json"
          with open(output_name, "w", encoding="utf-8") as output:
              json.dump(issues, output, indent=2, sort_keys=True)
          print(f"CODACY_TOTAL {len(issues)}")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr20-codacy-issues
          path: codacy-pr20-issues.json
          if-no-files-found: error
          retention-days: 1
