name: PR 19 Codacy diagnostics
on:
  push:
    branches:
      - review/pr19-codacy-diagnostics
permissions:
  contents: read
jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query public Codacy PR issues API
        run: |
          python3 - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          base = "https://api.codacy.com/api/v3/analysis/organizations/gh/wsg138/repositories/EnthusiaTags/pull-requests/19/issues"
          cursor = None
          total = 0
          page = 0
          while True:
              params = {"status": "new", "limit": "100"}
              if cursor:
                  params["cursor"] = cursor
              url = base + "?" + urllib.parse.urlencode(params)
              with urllib.request.urlopen(url, timeout=30) as response:
                  payload = json.load(response)
              page += 1
              rows = payload.get("data", [])
              print(f"CODACY_PAGE {page} COUNT {len(rows)}")
              for issue in rows:
                  total += 1
                  pattern = issue.get("patternInfo") or {}
                  location = issue.get("location") or {}
                  tool_info = issue.get("toolInfo") or {}
                  print("CODACY_ISSUE " + json.dumps({
                      "file": issue.get("filePath"),
                      "line": location.get("line") or issue.get("line"),
                      "column": location.get("column") or issue.get("column"),
                      "pattern": pattern.get("id"),
                      "level": pattern.get("level") or issue.get("level"),
                      "category": pattern.get("category") or issue.get("category"),
                      "message": issue.get("message"),
                      "tool": tool_info.get("name") or issue.get("tool"),
                      "raw": issue,
                  }, sort_keys=True))
              pagination = payload.get("pagination") or {}
              cursor = pagination.get("cursor")
              if not cursor:
                  break
          print(f"CODACY_TOTAL {total}")
          PY
