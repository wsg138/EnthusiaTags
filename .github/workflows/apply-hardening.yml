name: Apply anti-farm and daily IP hardening

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/anti-farm-natural-daily-ip'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/anti-farm-natural-daily-ip
          fetch-depth: 0

      - name: Apply reviewed implementation
        shell: bash
        run: |
          cat .github/scripts/hardening/part-* > /tmp/apply-hardening.py
          python3 /tmp/apply-hardening.py

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add anti-farm and daily IP safeguards"
          git push origin HEAD:agent/anti-farm-natural-daily-ip
