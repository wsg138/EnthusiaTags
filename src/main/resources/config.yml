config-version: 5

# MiniMessage format exposed to nametag consumers. `{tag}` is replaced with configured tag text.
line-format: "<gray>[{tag}<gray>]"

# Main /tags GUI title.
gui-title: "Your Tags"

# Menu labels. Legacy values remain supported for compatibility.
clear-item-name: "&cClear Tag"
no-tags-item-name: "&7No tags yet"

# Operational settings.
performance:
  # How often vanished / visibility state is rechecked.
  tag-visibility-refresh-ticks: 100

  # How often trail cosmetics tick.
  cosmetics-trail-ticks: 10

  # How often reward progress caches are flushed to disk.
  reward-save-interval-ticks: 200

  # Reward GUI progress cache time-to-live.
  reward-progress-cache-ticks: 100

  # Cosmetic/projectile caps. Defaults preserve normal behavior while preventing runaway load.
  max-tracked-projectiles: 300
  max-projectile-particles-per-tick: 600
  projectile-trail-max-age-ticks: 200

vanish:
  metadata-keys:
    - "vanished"
    - "vanish"
  treat-invisibility-effect-as-vanish: true

global-scan:
  enabled: true
  interval-minutes: 10
  max-players-per-tick: 1
  repair-mode: true
  report-only: false
  debug-log-repairs: false

rewards:
  lore-items:
    # Automatic handoff attempts stop here and move to REVIEW; staff loreretry can try again.
    max-auto-attempts: 48

  anti-farm:
    kills:
      # Each killer/victim pair may receive five credits in a true rolling hour.
      enabled: true
      rolling-window-minutes: 60
      rolling-window-max-kills: 5

  unlock-notifications:
    individual-limit: 3
  unlock-sound:
    enabled: true
    sound: "BLOCK_AMETHYST_BLOCK_CHIME"
    volume: 0.35
    pitch: 1.15

debug:
  performance:
    enabled: false
    log-interval-seconds: 300

daily:
  timezone: "America/Indiana/Indianapolis"
  currency-label: "Raw Gold"
  payouts: [5, 10, 15, 20, 30, 40, 50]

  # One successful or uncertain daily transaction per IP and date.
  # Use /enthusiatags daily sibling add <player1> <player2> for shared households.
  ip-limit:
    enabled: true

  # Plays when /daily is opened. This is a global server option, not a player GUI toggle.
  animation:
    enabled: true
    frames: 20
    frame-ticks: 2
    sound:
      enabled: true
      step-sound: "BLOCK_NOTE_BLOCK_HAT"
      accent-sound: "BLOCK_NOTE_BLOCK_CHIME"
      volume: 0.35
      starting-pitch: 0.72
      pitch-step: 0.055
      final-sound: "BLOCK_AMETHYST_BLOCK_CHIME"
      final-volume: 0.65
      final-pitch: 1.2

  # Short confirmation sound after a successful claim.
  claim-sound:
    enabled: true
    sound: "ENTITY_EXPERIENCE_ORB_PICKUP"
    volume: 0.7
    pitch: 1.25

