config-version: 3

# Format shown above the player. `{tag}` is replaced with the configured tag text.
line-format: "&7[{tag}&7]"

# Main /tags GUI title.
gui-title: "Your Tags"

# Menu labels.
clear-item-name: "&cClear Tag"
no-tags-item-name: "&7No tags yet"

# Vertical offset for the floating tag display.
display-offset: 0.06

# Operational settings.
performance:
  # How often vanished / visibility state is rechecked.
  tag-visibility-refresh-ticks: 100

  # How often trail cosmetics tick.
  cosmetics-trail-ticks: 10

  # How often reward progress caches are flushed to disk.
  reward-save-interval-ticks: 200

  # Reward GUI progress cache time-to-live.
  reward-progress-cache-ticks: 100

  # Cosmetic/projectile caps. Defaults preserve normal behavior while preventing runaway load.
  max-tracked-projectiles: 300
  max-projectile-particles-per-tick: 600
  projectile-trail-max-age-ticks: 200

vanish:
  metadata-keys:
    - "vanished"
    - "vanish"
  treat-invisibility-effect-as-vanish: true

global-scan:
  enabled: true
  interval-minutes: 10
  max-players-per-tick: 1
  repair-mode: true
  report-only: false
  debug-log-repairs: false

rewards:
  unlock-sound:
    enabled: true
    sound: "BLOCK_AMETHYST_BLOCK_CHIME"
    volume: 0.35
    pitch: 1.15

debug:
  performance:
    enabled: false
    log-interval-seconds: 300

daily:
  timezone: "America/Indiana/Indianapolis"
  payouts: [5, 10, 15, 20, 30, 40, 50]
  animation:
    enabled: true
    default-player-preference: true
    duration-ticks: 15

