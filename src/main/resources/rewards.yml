    icon: "SKELETON_SKULL"
  economy:
    name: "&6Economy"
    icon: "GOLD_INGOT"
  exploration:
    name: "&3Exploration"
    icon: "COMPASS"
  misc:
    name: "&dMisc"
    icon: "NAME_TAG"
underground-max-y: 56
rewards:
  first_hour:
    name: '&aFirst Hour'
    description:
      - '&7Spend your first hour on the server.'
    icon: CLOCK
    category: playtime
    criteria:
