---
# Unit/regression tests and the repository-local SPEAR harness are verified by the
# exact-head CI workflow. Keeping them out of the PR quality delta avoids applying
# production/browser/J2EE rule profiles to test-only and Node CLI code.
exclude_paths:
  - "src/test/**"
  - "tools/spear/**"
  - "resource-pack/**"
  - "resourcepack/**"

# The Python bootstrap remains in global/security analysis. Prospector's isolated
# environment does not install the hash-pinned CI requirements, so dependency/type
# diagnostics for this directory are not authoritative; its own tests run after
# `pip install --require-hashes` in CI.
engines:
  prospector:
    exclude_paths:
      - "tools/ci/**"
  metric:
    exclude_paths:
      - "tools/ci/**"
